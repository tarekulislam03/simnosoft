    <path d="M32 26 Q35 25 38 26" stroke="#2D2319" stroke-width="1.4" stroke-linecap="round" fill="none" />
    <path d="M42 26 Q45 25 48 26" stroke="#2D2319" stroke-width="1.4" stroke-linecap="round" fill="none" />
    <!-- Smile -->
