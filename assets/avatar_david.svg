      <stop offset="0%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="40" cy="40" r="40" fill="url(#bg-david)" />
