    <rect x="35" y="42" width="10" height="9" rx="2" fill="#DDA070" />
    <!-- Head -->
    <ellipse cx="40" cy="31" rx="14" ry="16" fill="#ECC09A" />
    <!-- Hair -->
    <path d="M26 28 C26 19, 32 14, 40 14 C48 14, 54 19, 54 28 C52 22, 47 18, 40 18 C33 18, 28 22, 26 28 Z" fill="#4B5563" />
    <path d="M26 25 Q30 19 36 17 Q32 23 27 27 Z" fill="#374151" />
