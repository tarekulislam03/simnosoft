    <ellipse cx="26" cy="32" rx="2.5" ry="4" fill="#DDA070" />
    <ellipse cx="54" cy="32" rx="2.5" ry="4" fill="#DDA070" />
    <!-- Glasses -->
    <rect x="31" y="27" width="8" height="7" rx="2" fill="none" stroke="#1E293B" stroke-width="1.4" />
    <rect x="41" y="27" width="8" height="7" rx="2" fill="none" stroke="#1E293B" stroke-width="1.4" />
    <line x1="39" y1="30" x2="41" y2="30" stroke="#1E293B" stroke-width="1.4" />
    <line x1="28" y1="29" x2="31" y2="29" stroke="#1E293B" stroke-width="1.4" />
    <line x1="49" y1="29" x2="52" y2="29" stroke="#1E293B" stroke-width="1.4" />
    <!-- Eyes behind glasses -->
    <circle cx="35" cy="30.5" r="1.3" fill="#1E293B" />
    <circle cx="45" cy="30.5" r="1.3" fill="#1E293B" />
    <!-- Eyebrows -->
    <path d="M31 24 Q35 23 38 24" stroke="#4B5563" stroke-width="1.4" stroke-linecap="round" fill="none" />
    <path d="M42 24 Q45 23 49 24" stroke="#4B5563" stroke-width="1.4" stroke-linecap="round" fill="none" />
